name: Deploy to Hosting

on:
  push:
    branches: [ hosting ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install Backend Dependencies
      run: |
        cd backend
        composer install --no-dev --optimize-autoloader

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        DISABLE_ESLINT_PLUGIN=true REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }} npm run build

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOSTING_HOST }}
        username: ${{ secrets.HOSTING_USER }}
        key: ${{ secrets.HOSTING_SSH_KEY }}
        script: |
          mkdir -p xanderwhite_ru/public_html/projects/courses
          cd xanderwhite_ru/public_html/projects/courses

          # ДЕБАГ - проверяем какие файлы доступны
          echo "=== GITHUB_WORKSPACE содержимое ==="
          ls -la $GITHUB_WORKSPACE/
          echo "=== backend содержимое ==="
          ls -la $GITHUB_WORKSPACE/backend/
          echo "=== frontend/build содержимое ==="
          ls -la $GITHUB_WORKSPACE/frontend/build/

          # Удаляем старые файлы кроме .env
          ls -A | grep -v '.env' | xargs rm -rf

          # Копируем файлы бэкенда
          cp -r $GITHUB_WORKSPACE/backend/* .
          rm -rf public

          # Копируем сборку фронтенда в public
          cp -r $GITHUB_WORKSPACE/frontend/build public

          echo "✅ Deploy completed!"