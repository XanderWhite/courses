name: Deploy to Hosting

on:
  push:
    branches: [ hosting ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install Backend Dependencies
      run: |
        cd backend
        composer install --no-dev --optimize-autoloader

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        DISABLE_ESLINT_PLUGIN=true REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }} npm run build

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOSTING_HOST }}
        username: ${{ secrets.HOSTING_USER }}
        key: ${{ secrets.HOSTING_SSH_KEY }}
        script: |
          mkdir -p xanderwhite_ru/public_html/projects/courses
          cd xanderwhite_ru/public_html/projects/courses

          # ДЕБАГ - проверяем из корня репозитория
          echo "=== Текущая директория ==="
          pwd
          echo "=== Содержимое репозитория ==="
          ls -la
          echo "=== backend содержимое ==="
          ls -la backend/

          # Удаляем старые файлы кроме .env
          ls -A | grep -v '.env' | xargs rm -rf

          # Копируем из корня репозитория
          cp -r backend/* .
          rm -rf public
          cp -r frontend/build public

          echo "✅ Deploy completed!"