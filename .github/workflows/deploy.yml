name: Deploy to Hosting

on:
  push:
    branches: [ hosting ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install Backend Dependencies
      run: |
        cd backend
        composer install --no-dev --optimize-autoloader

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        DISABLE_ESLINT_PLUGIN=true REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }} PUBLIC_URL=/projects/courses npm run build

    - name: Prepare deployment structure
      run: |
        mkdir -p deploy/backend deploy/public
        cp -r backend/* deploy/backend/
        cp -r frontend/build/* deploy/public/
        rm -rf deploy/backend/public

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.0
      with:
        host: ${{ secrets.HOSTING_HOST }}
        username: ${{ secrets.HOSTING_USER }}
        key: ${{ secrets.HOSTING_SSH_KEY }}
        source: "deploy/"
        target: "xanderwhite_ru/public_html/projects/courses"
        rm: true

    - name: Fix structure on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOSTING_HOST }}
        username: ${{ secrets.HOSTING_USER }}
        key: ${{ secrets.HOSTING_SSH_KEY }}
        script: |
          cd xanderwhite_ru/public_html/projects/courses
          mv deploy/backend/* .
          mv deploy/public public
          rm -rf deploy
          echo "✅ Structure fixed"